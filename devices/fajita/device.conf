# devices/fajita/device.conf: what this device repository is (docs/porting/repositories.md has every word). To become a
# repository of its own, hakios-sdm845, as redwood's is hakios-sm7325. What is "works" here has been seen on the phone.
# Its UEFI: fajitaPkg, Mu-Silicium's enchiladaPkg with the 6T's name and 1080x2340 panel, CPRDxe left out (uefi/, README.md);
# its loader platform "fajita" (UEFI's framebuffer at 0x9D400000), fastboot with the old USB driver's quirks.

device fajita
	title       OnePlus 6T (A6013)
	vendor      OnePlus
	soc         sdm845
	defconfig   fajita_defconfig
	firmware    pull-firmware.sh
	maintainer  xreactx
	status      display     works     the panel (command mode) through UEFI's splash memory, three buffers flipped through VIG0 (fb_flip=1 fb_map_mb=30 soc_display=845); Darwin draws with the GPU; brightness (CoreBrightness through an AppleARMBacklight, DCS 0x51 0-1023) and the panel off and on with the power button (DCS 28/10, 11/29), commands through DSI 0's command FIFO between frames
	status      cpu         works     8 cores (bootcpu=7), GICv3, the virtual timer on intid 19 (soc_vtimer=19); the big cores' clocks raised through the OSM (cpufreq_osm=2)
	status      storage     works     UFS 2.1 read through the loader and the kernel's own driver (ufs=2); /private/var kept at the end of system_a (ufs_write=1 var_store=1)
	status      touch       works     Synaptics S3706B (RMI4) on I2C done by hand (synaptics=3)
	status      buttons     works     power, volume up and down on the PM8998 (buttons=2); the alert slider as the ring/silent switch (slider=3)
	status      gpu         works     Adreno 630: Mesa freedreno "FD630" (gpu=1 soc_gpu=630 adreno_speed=7)
	status      audio       works     the audio DSP (adsp=1); the loudspeaker through QUAT MI2S and the TFA9894 (sound=4); the earpiece (sound_receiver=1) and the handset microphone (mic=4 mic_wcd=1) through the WCD934x over SLIMbus (slim=3)
	status      battery     works     the bq27411 fuel gauge Android reads, on I2C (bq27541=1); the PMI8998's charger charges during a run (pmi_charger=2: 900 mA in on a computer's port, 500 mA into the battery); UEFI's ChargerEx (battery=1) for the charger's presence
	status      haptic      works     the PMI8998's haptics block (pmi_haptics=4)
	status      thermal     works     reading only: tsens v2, 21 sensors (thermal=1)
	status      wifi        works     WCN3990: the modem starts its Wi-Fi domain; Linux's ath10k (ATH=ath10k) scans, joins a WPA2 network and carries Darwin's traffic (wifi6t=1 wifi_join=1, in the configuration)
	status      cellular    works     the modem boots and registers on LTE (modem=1, in the configuration); mobile data through the IPA: with a Google Fi SIM (12 November) the session came up on the modem's default profile, pings and DNS were answered and Safari loaded pages with Wi-Fi off (modem_apn=NAME for another APN)
	status      sms         works     texts through QMI WMS, the Texts application (userland/src/Texts.m): conversations named from the contacts, compose to a number or a contact; sent through kern.hakios.sms_send in GSM 7-bit (the keyboard's quotes and dashes folded in) or UCS-2, long ones in concatenated parts (run 215215: 276 characters in 2 parts, one text on the other phone); received ones through kern.hakios.sms_inbox to smsd, long ones put together (359 characters in 3 parts), emoji both ways, an alert with the contact's name; /var/mobile/Library/HakiOS/texts.txt. MMS received (run 174355): the notification acknowledged by us when the modem leaves it (WMS Send Ack; without it the network held back its second part), the message fetched over the cellular connection (en1) through AT&T's WAP proxy, unpacked (text, pictures saved under /var/mobile/Library/HakiOS/mms), acknowledged to the MMSC, a picture shown in Texts; MMS sent (run 180011): a picture chosen in Texts (the camera's DCIM and received ones), made 1280 pixels and under 300 KB, handed to smsd through /var/mobile/Library/HakiOS/outbox, sent as m-send-req (multipart.mixed: text and image/jpeg) through the WAP proxy; group texts (run 184132): sent to several (Texts: names or numbers separated by commas; a To header each), arrived as a group; received ones put in a group conversation by their To/Cc (this phone left out: kern.hakios.own_number, from the IMS registration), the sender named on each bubble -- received ones too (a real reply, run 184132)
	status      calls       partial   VoLTE (18 November): IMS registers by default (dcm, imsrtp, ims_plain on; =0 turns each off) -- the modem's IMS brings up the "ims" connection through the DCM service, HakiOS starts it on LTE and tells the modem the address and its instance; IMSA: registered, voice and SMS over IMS available. An incoming VoLTE call rings through and is answered (call_answer=1) and held (15 s, run 221801); call_to=DIGITS dials. Call audio (18 November, run after 230418): the DSP's voice session (VoiceMMode1 "11C05000": MVM, CVS, a vocproc on SLIMBUS_0_TX/RX with no topology) started while the call talks -- both ways: the other side hears the handset microphone, the earpiece plays the other side. Ringing screen (userland calld): an incoming call shows an Answer/Decline alert with a ringtone, then an alert with End, through kern.hakios.call_action. Outgoing calls from the Phone Pad application (a keypad; kern.hakios.call_dial), shown as "Calling..." with End. In-call controls (19 November, runs 190955 and 191509): the call's alert has End, Speaker/Earpiece (the vocproc rebuilt on QUAT_MI2S_RX 0x1006, the loudspeaker, or the earpiece) and Mute/Unmute (CVS VSS_IVOLUME_CMD_MUTE_V2, TX) through kern.hakios.call_audio. In-call volume (run 193829): the volume buttons step the earpiece's codec digital volume (CDC_RX0_RX_VOL_CTL, -15 to +6 dB; kern.hakios.call_volume 0-5) -- the DSP refuses VSS_IVOLUME_CMD_SET_STEP without a volume calibration; on the loudspeaker the TFA9894's firmware volume (VOL, register 0x51 bits 8-15, 0.5 dB steps: 0 to -20 dB, never above Android's level; run 205412). Tested (run 193829): Decline ends a ringing call (the caller goes to voicemail); a hang-up by the other side closes the call's alert. The phone vibrates while it rings (kSystemSoundID_Vibrate every 1.5 s through the audio plugin to pmi_haptics; run 195231). Recents and Contacts (run 202946): calld writes each call to /var/mobile/Library/HakiOS/calls.txt (start, in/missed/declined/out, number, seconds), Phone Pad shows it as Recents (tap: call back) and iOS's contacts with + to add (tap: call); the ringing screen shows the contact's name (calld asks contactsd, run 210642; Phone Pad's names.txt kept as a fallback). At the ear (run 220201): during a call on the earpiece the proximity sensor turns the panel off and drops touches, back when it is taken away (not on the loudspeaker)
	status      bluetooth   works     WCN3990 over UART (bt6t=5): iOS's own bluetoothd; pairing, A2DP, and a headset's call audio both ways through the second SLIMbus (btslim=6)
	status      camera      works     Camera.app with both cameras (cam6t=6, the default): the rear IMX519 over three C-PHY trios with its lens motor, the front IMX371 over four D-PHY lanes, live preview, switching, photographs; frames through CSID-lite, IFE-lite and an SMMU context of ours into /dev/hakios-camera, redwood's ISP in mediaserverd
	status      gps         works     the modem's GNSS through QMI LOC (on with the modem; gnss=0: off): a fix every second, 3 m, the first some 10 s in by a window; handed to locationd as simulated locations (userland/src/gnssd.m); Settings shows Location Services (src/inject_loc.c); Compass shows the coordinates. Maps draws nothing (Metal)
	status      sensors     partial   the accelerometer (BMI160 behind the SLPI): the SLPI started on every run (slpi=0: not), its files served over FastRPC, SEE's "accel" read at 10 Hz (kern.hakios.accel_*); the screen rotates in apps (backboardd told the orientation, userland/src/inject.c); gyroscope, magnetometer, ambient light and proximity read too (kern.hakios.gyro_*, mag_*, light, proximity); Compass works (heading from the SLPI's geomag_rv, answered inside Compass: src/inject_loc.c; a figure-8 calibration after each boot, not saved yet); auto-brightness from the light sensor, done in the kernel (fb_auto=0: off), not CoreBrightness (its HID ALS path crashes without Apple calibration; als_hid=1 to try); applications get them through CoreMotion (libhakios.motion.dylib in every app in /Applications: accelerometer, gyroscope, magnetometer, device motion; the Level application, src/Level.m, user-confirmed run 235140)
