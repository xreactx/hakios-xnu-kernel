# devices/fajita/device.conf: what this device repository is (docs/porting/repositories.md has every word). To become a
# repository of its own, hakios-sdm845, as redwood's is hakios-sm7325. What is "works" here has been seen on the phone.
# Its UEFI: fajitaPkg, Mu-Silicium's enchiladaPkg with the 6T's name and 1080x2340 panel, CPRDxe left out (uefi/, README.md);
# its loader platform "fajita" (UEFI's framebuffer at 0x9D400000), fastboot with the old USB driver's quirks.

device fajita
	title       OnePlus 6T (A6013)
	vendor      OnePlus
	soc         sdm845
	defconfig   fajita_defconfig
	firmware    pull-firmware.sh
	maintainer  xreactx
	status      display     works     the panel (command mode) through UEFI's splash memory, three buffers flipped through VIG0 (fb_flip=1 fb_map_mb=30 soc_display=845); Darwin draws with the GPU
	status      cpu         works     8 cores (bootcpu=7), GICv3, the virtual timer on intid 19 (soc_vtimer=19); the big cores' clocks raised through the OSM (cpufreq_osm=2)
	status      storage     works     UFS 2.1 read through the loader and the kernel's own driver (ufs=2); /private/var kept at the end of system_a (ufs_write=1 var_store=1)
	status      touch       works     Synaptics S3706B (RMI4) on I2C done by hand (synaptics=3)
	status      buttons     works     power, volume up and down on the PM8998 (buttons=2); the alert slider as the ring/silent switch (slider=3)
	status      gpu         works     Adreno 630: Mesa freedreno "FD630" (gpu=1 soc_gpu=630 adreno_speed=7)
	status      audio       works     the audio DSP (adsp=1); the loudspeaker through QUAT MI2S and the TFA9894 (sound=4); the earpiece (sound_receiver=1) and the handset microphone (mic=4 mic_wcd=1) through the WCD934x over SLIMbus (slim=3)
	status      battery     works     the bq27411 fuel gauge Android reads, on I2C (bq27541=1); the PMI8998's charger charges during a run (pmi_charger=2: 900 mA in on a computer's port, 500 mA into the battery); UEFI's ChargerEx (battery=1) for the charger's presence
	status      haptic      works     the PMI8998's haptics block (pmi_haptics=4)
	status      thermal     works     reading only: tsens v2, 21 sensors (thermal=1)
	status      wifi        works     WCN3990: the modem starts its Wi-Fi domain; Linux's ath10k (ATH=ath10k) scans, joins a WPA2 network and carries Darwin's traffic (wifi6t=1 wifi_join=1, in the configuration)
	status      cellular    partial   the modem boots and registers on LTE with a SIM (modem=1, in the configuration); the data session comes up and packets go out, none come back (the test SIM had no data under Android either)
	status      bluetooth   works     WCN3990 over UART (bt6t=5): iOS's own bluetoothd; pairing, A2DP, and a headset's call audio both ways through the second SLIMbus (btslim=6)
	status      camera      partial   the three sensors (IMX519 rear main, IMX376K rear second, IMX371 front) powered as Android powers them and answering with their chip IDs over the CCI pins done by hand (cam6t=2); the CSID's test pattern through IFE-lite and an SMMU context of ours into memory, fetched with xl camera (cam6t=4); no sensor frames yet
