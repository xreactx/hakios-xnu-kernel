# devices/oneplus-6t/device.conf: what this device directory is. Laid out like hakios-sm7325's, so that it can become a device
# repository of its own (hakios-sdm845) when the common tree moves to tools/hakios-device.py.

device fajita
	title       OnePlus 6T (A6013)
	vendor      OnePlus
	soc         sdm845
	defconfig   fajita_defconfig
	firmware    pull-firmware.sh
	maintainer  the OnePlus 6T port (README.md)
	status      uefi        works     fajitaPkg: Mu-Silicium's enchiladaPkg with the 6T's name and 1080x2340 panel; Binaries/enchilada
	status      loader      works     platform "fajita" (UEFI's framebuffer at 0x9D400000); fastboot over USB with the old driver's quirks (usb_old_driver)
	status      display     works     the panel through UEFI's framebuffer, drawn in software: SpringBoard's home screen (30 October 2026)
	status      cpu         works     8 cores (bootcpu=7: the kernel on 7, the loader on 0), GICv3 where redwood's is, the virtual timer on intid 19 (soc_vtimer=19); small 0-3 (Kryo 385 Silver), big 4-7 (Kryo 385 Gold)
	status      storage     untested  UFS 2.1 (0x1d84000, 2 lanes), read through the loader as on redwood
	status      touch       works     Synaptics S3706B (RMI4, F12) on I2C done by hand (GPIO 49/50, address 0x20, IRQ GPIO 125, reset GPIO 99), 3.0 V through RPMh; synaptics=3 from run.args (30 October 2026)
	status      buttons     works     buttons=2: power (PON KPDPWR), volume up (GPIO6), volume down (GPIO5, not RESIN) on the PM8998, read through the PMIC arbiter (v5); the alert slider (oneplus,tri-state-key, slider=3: GPIOs 24/52/126) is iOS's ring/silent switch, banner and buzz (30 October 2026)
	status      gpu         missing   Adreno 630 (chipid 0x6030001): a630_sqe.fw, a630_gmu.bin, a630_zap
	status      audio       started   hakios.adsp.c steps 1-5 (shared memory, firmware, the AOP mailbox, TrustZone takes the image, the image written, SMP2P and GLINK items made, the DSP started and stopped) work with soc_* args; firmware off the flash (xl flash-read modem_b); the loudspeaker is a TFA9894 on QUAT MI2S, the WCD934x "tavil" (SLIMbus) for the rest; README step 10
	status      battery     works     battery=1: through the loader -- UEFI's ChargerEx (presence, voltage) and PmicDxe's fuel gauge (charge, current, temperature; PMIC 1), both vetted by disassembly; QcomCharger is a different release and never called (30 October 2026)
	status      haptic      works     pmi_haptics=4: the PMI8998's haptics block (SPMI 0x3c0), direct play, for iOS's haptics through /dev/hakios-haptic; the kernel's only PMIC writes, to that block alone (30 October 2026)
	status      wifi        missing   WCN3990 (icnss; Linux's ath10k_snoc), firmware wlanmdsp.mbn loaded by the modem
	status      bluetooth   missing
	status      cellular    missing   IPA 3.5.1 (not 4.11), no IPCC, the modem loaded through the MBA rather than TrustZone's PAS
	status      thermal     works     reading only: tsens v2, 21 sensors (TM 0xc263000 and 0xc265000), thermal=1 logs them; nothing acts on them (the SoC's LMh throttles by itself) (30 October 2026)
